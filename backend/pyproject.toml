[project]
name = "nexacore-ops"
version = "0.1.0"
description = "NexaCore Agentic Ops Intelligence — LangGraph multi-agent prototype"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.17",
  "langgraph>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-bdd>=7", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
